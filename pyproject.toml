[project]
name = "ctxline"
dynamic = ["version"]
description = "A Claude Code status line for context and usage limits"
readme = "README.md"
license = "MIT"
authors = [{ name = "Eric Wafula" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/ericwafula/ctxline"

[project.scripts]
ctxline = "ctxline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ctxline/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
