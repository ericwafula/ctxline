name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: "18"
      - name: Python tests
        run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests
      - name: Node tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ctxline/__init__.py)"
          node_version="$(node -p 'require("./package.json").version')"
          echo "tag $tag, python $python_version, node $node_version"
          if [ "$tag" != "$python_version" ] || [ "$tag" != "$node_version" ]; then
            echo "::error::Tag v$tag doesn't match __version__ ($python_version) and package.json ($node_version)"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ctxline/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/ctxline
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          echo "npm $(npm --version)"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::Trusted publishing needs npm 11.5.1 or later"; exit 1; }
      - name: Publish
        run: npm publish
