name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: "18"
      - name: Python tests
        run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests
      - name: Node tests
        run: npm test

  # Only for the "Run workflow" button: bumps both versions, commits to main and tags.
  # A tag pushed with GITHUB_TOKEN doesn't start another run, so this run carries on and publishes it.
  release:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not $GITHUB_REF_NAME"
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ctxline/__init__.py)"
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
            *) echo "::error::Unknown bump $BUMP"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$next" > /dev/null; then
            echo "::error::Tag v$next already exists"
            exit 1
          fi
          sed -i "s/^__version__ = \"$current\"$/__version__ = \"$next\"/" src/ctxline/__init__.py
          sed -i "s/^  \"version\": \"$current\",$/  \"version\": \"$next\",/" package.json
          if [ "$(git diff --name-only | wc -l)" -ne 2 ]; then
            echo "::error::Expected both src/ctxline/__init__.py and package.json at $current"
            git diff
            exit 1
          fi
          echo "$current -> $next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
      - name: Commit, tag and push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore/release: bumps ctxline to ${TAG#v}"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

  build:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.TAG }}
    env:
      TAG: ${{ needs.release.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the version
        run: |
          tag="${TAG#v}"
          python_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ctxline/__init__.py)"
          node_version="$(node -p 'require("./package.json").version')"
          echo "tag $tag, python $python_version, node $node_version"
          if [ "$tag" != "$python_version" ] || [ "$tag" != "$node_version" ]; then
            echo "::error::Tag v$tag doesn't match __version__ ($python_version) and package.json ($node_version)"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ctxline/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/ctxline
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          echo "npm $(npm --version)"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::Trusted publishing needs npm 11.5.1 or later"; exit 1; }
      - name: Publish
        run: npm publish

  homebrew:
    needs: [build, publish-pypi, publish-npm]
    if: ${{ !cancelled() && needs.publish-pypi.result == 'success' && needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Checksum the release tarball
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/$TAG.tar.gz"
          curl -sfL --retry 3 -o release.tar.gz "$url"
          echo "URL=$url" >> "$GITHUB_ENV"
          echo "SHA=$(sha256sum release.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: ericwafula/homebrew-tools
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Bump Formula/ctxline.rb
        working-directory: tap
        run: |
          sed -i -E "s|^  url \".*\"|  url \"$URL\"|; s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/ctxline.rb
          if git diff --quiet; then
            echo "Formula already points at $TAG"
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat : bumps ctxline to ${TAG#v}"
          git push
