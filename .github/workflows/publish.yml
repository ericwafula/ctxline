name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "18"
      - name: Python tests
        run: python -m unittest discover -s tests
      - name: Node tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ctxline/__init__.py)"
          node_version="$(node -p 'require("./package.json").version')"
          echo "tag $tag, python $python_version, node $node_version"
          if [ "$tag" != "$python_version" ] || [ "$tag" != "$node_version" ]; then
            echo "::error::Tag v$tag doesn't match __version__ ($python_version) and package.json ($node_version)"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ctxline/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
